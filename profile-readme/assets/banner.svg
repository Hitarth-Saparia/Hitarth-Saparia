<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440">
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#34322b"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#c9a96e" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#c9a96e" stop-opacity="0"/>
    </radialGradient>
    <style>
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 0%,50% { opacity:1 } 50.01%,100% { opacity:0 } }
      .pulse { animation: pulse 2.2s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.25 } }
      .rise { animation: rise 1.2s ease-out both; }
      @keyframes rise { from { opacity:0; transform:translateY(14px) } to { opacity:1; transform:translateY(0) } }
    </style>
  </defs>
  <rect width="1280" height="440" rx="14" fill="#1b1a16"/>
  <rect width="1280" height="440" rx="14" fill="url(#dots)"/>
  <rect width="1280" height="440" rx="14" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="439" rx="13.5" fill="none" stroke="#34322b"/>

  <text x="48" y="58" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="13" letter-spacing="3" fill="#8f887a">HS / PORTFOLIO &#8212; 2026</text>
  <text x="1232" y="58" text-anchor="end" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="13" letter-spacing="3" fill="#8f887a">PUNE, IN &#183; 18.52&#176;N 73.85&#176;E</text>
  <line x1="48" y1="82" x2="1232" y2="82" stroke="#34322b"/>

  <g class="rise">
    <text x="640" y="212" text-anchor="middle" font-family="Inter,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="800" font-size="112" letter-spacing="-3" fill="#efe6d2">Hitarth Saparia</text>
    <text x="616" y="266" text-anchor="end" font-family="Inter,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="600" font-size="21" letter-spacing="6" fill="#efe6d2">FULL STACK DEVELOPER</text>
    <circle cx="640" cy="259" r="3.5" fill="#c9a96e"/>
    <text x="664" y="266" text-anchor="start" font-family="Inter,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="600" font-size="21" letter-spacing="6" fill="#efe6d2">AI / DATA SCIENCE</text>
    <line x1="590" y1="296" x2="690" y2="296" stroke="#c9a96e" stroke-width="2"/>
    <text x="640" y="334" text-anchor="middle" font-family="Inter,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-style="italic" font-size="19" fill="#8f887a">Building intelligent products, from interface to model.</text>
    <rect class="blink" x="888" y="316" width="10" height="22" fill="#c9a96e"/>
  </g>

  <line x1="48" y1="372" x2="1232" y2="372" stroke="#34322b"/>
  <circle class="pulse" cx="52" cy="406" r="5" fill="#9bb58a"/>
  <text x="68" y="411" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="13" letter-spacing="3" fill="#efe6d2">OPEN TO FULL-TIME &amp; FREELANCE ROLES</text>
  <text x="1232" y="411" text-anchor="end" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="13" letter-spacing="3" fill="#8f887a">B.TECH AI &amp; DS &#183; CLASS OF 2028</text>
</svg>